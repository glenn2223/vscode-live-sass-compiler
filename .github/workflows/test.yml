name: Tests

on:
    pull_request:
        branches:
            - "**"

    # ALLOW MANUAL RUNS
    workflow_dispatch:

# Explicit minimal permissions following security best practices
permissions:
    contents: read # Required to checkout repository code

jobs:
    build:
        strategy:
            matrix:
                os: [macos-latest, ubuntu-latest, windows-latest]
        runs-on: ${{ matrix.os }}
        steps:
            - name: Checkout
              uses: actions/checkout@v4

            - name: Install Node.js
              uses: actions/setup-node@v4
              with:
                  node-version: 20.x

            - name: Install the package dependencies
              run: npm ci

            - name: Test extension
              if: runner.os == 'Linux'
              run: xvfb-run -a npm test

            - name: Test extension
              if: runner.os != 'Linux'
              run: npm test

            - name: Ensure prePublish script is working
              if: runner.os != 'Linux'
              run: npm run vscode:prepublish

            - name: Ensure prePublish script is working
              if: runner.os == 'Linux'
              run: xvfb-run -a npm run vscode:prepublish

            # The universal VSIX has no native Sass compiler: the extension
            # uses `sass` (pure JS), which must be packaged with all it needs
            - name: Ensure the universal VSIX can compile
              if: runner.os == 'Linux'
              shell: bash
              run: |
                  find node_modules -maxdepth 1 -name 'sass-embedded-*' -type d -exec rm -rf {} +
                  node .github/scripts/sass-fallback-vscodeignore.js >> .vscodeignore
                  npx --yes @vscode/vsce package --out "$RUNNER_TEMP/universal.vsix"
                  git checkout -- .vscodeignore

                  UNPACKED_VSIX="$(mktemp -d)"
                  unzip -q "$RUNNER_TEMP/universal.vsix" -d "$UNPACKED_VSIX"
                  node .github/scripts/check-universal-vsix.js "$UNPACKED_VSIX"

            # The native compilers were removed by the step above
            - name: Test extension with the pure JS compiler
              if: runner.os == 'Linux'
              run: xvfb-run -a npm test
